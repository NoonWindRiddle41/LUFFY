name: todo-audit
on:
  push:
    branches: [docs/update-todo-list]
    paths: ['.github/workflows/todo-audit.yml']
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch main and dev
        run: |
          git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main dev:refs/remotes/origin/dev || git fetch origin main dev
      - name: Audit
        run: |
          python3 - <<'PY'
          import os, re, subprocess, tarfile, io, tarfile
          from collections import defaultdict

          def git(*a):
              return subprocess.run(["git", *a], capture_output=True, text=True).stdout

          def show(ref, path):
              r = subprocess.run(["git", "show", f"{ref}:{path}"], capture_output=True, text=True)
              return r.stdout if r.returncode == 0 else None

          def parse_readme(txt):
              out = []
              sec = txt.split("### 📝 Complete TODO List", 1)[1]
              for m in re.finditer(r"^- \[ \] \*\*(.+?):(\d+)\*\* - (.*)$", sec, re.M):
                  out.append((m.group(1), int(m.group(2)), m.group(3).rstrip()))
              return out

          def extract_code(tree):
              blob = subprocess.run(["git", "archive", tree], capture_output=True).stdout
              tf = tarfile.open(fileobj=io.BytesIO(blob))
              res = defaultdict(list)
              for m in tf.getmembers():
                  if not m.isfile() or not m.name.endswith(".py"):
                      continue
                  f = tf.extractfile(m)
                  if not f:
                      continue
                  text = f.read().decode("utf-8", "replace")
                  for i, line in enumerate(text.splitlines(), 1):
                      if "TODO" in line:
                          res[m.name].append((i, line.strip()[:200]))
              return res

          main_readme = show("origin/main", "README.md")
          dev_readme = show("origin/dev", "README.md")
          me = parse_readme(main_readme)
          de = parse_readme(dev_readme)
          print("MAIN README entries:", len(me), " DEV README entries:", len(de))

          names = git("diff", "--name-only", "origin/main...origin/dev").split()
          pyc = sorted(n for n in names if n.endswith(".py"))
          print("CHANGED PY FILES main...dev:", pyc)

          code_main = extract_code("origin/main")
          code_dev = extract_code("origin/dev")
          cdm = {f: {i: t for i, t in v} for f, v in code_main.items()}
          cdd = {f: {i: t for i, t in v} for f, v in code_dev.items()}

          mread = defaultdict(dict)
          for p, l, t in me:
              mread[p][l] = t
          dread = defaultdict(dict)
          for p, l, t in de:
              dread[p][l] = t

          fail = []
          for f in pyc:
              cpos = set(cdd.get(f, {}))
              rpos = set(dread.get(f, {}))
              missing = sorted(cpos - rpos)
              stale = sorted(rpos - cpos)
              print("\n== DEV CHECK", f, "codeTODO=", len(cpos), "devREADME=", len(rpos),
                    "missing=", missing, "stale=", stale)
              for i in sorted(cpos | rpos):
                  ct = cdd.get(f, {}).get(i, "<none>")
                  rt = dread.get(f, {}).get(i, "<none>")
                  mark = "OK" if (i in cpos and i in rpos) else "XX"
                  print("  %s %s:%s\n      CODE  : %s\n      README: %s" % (mark, f, i, ct, rt))
              if missing or stale:
                  fail.append(f)
              cpos0 = set(cdm.get(f, {}))
              rpos0 = set(mread.get(f, {}))
              print("  [main-baseline] code=", len(cpos0), "readme=", len(rpos0),
                    "missing=", sorted(cpos0 - rpos0), "stale=", sorted(rpos0 - cpos0))

          keys = [(p, l) for p, l, _ in de]
          order_bad = [(keys[i], keys[i + 1]) for i in range(len(keys) - 1) if keys[i] >= keys[i + 1]]
          dupes = len(keys) - len(set(keys))
          title_count = dev_readme.count("### 📝 Complete TODO List")
          print("\nINVARIANTS dev: title_count=", title_count, "order_violations=", len(order_bad),
                "dupes=", dupes, "entries=", len(de))
          if order_bad[:5]:
              print("ORDER BAD:", order_bad[:5])

          mp = defaultdict(set)
          dp = defaultdict(set)
          for p, l, t in me:
              mp[p].add((l, t))
          for p, l, t in de:
              dp[p].add((l, t))
          changed_readme_paths = sorted(p for p in set(mp) | set(dp) if mp[p] != dp[p])
          print("README-CHANGED PATHS:", changed_readme_paths)

          def parts(txt):
              before, rest = txt.split("### 📝 Complete TODO List", 1)
              idx = rest.find("\n## ")
              return before, rest[idx:]

          bm, tm = parts(main_readme)
          bd, td = parts(dev_readme)
          print("OUTSIDE-SECTION IDENTICAL:", bm == bd and tm == td)

          other = sorted(f for f in code_dev if not f.startswith("luffy/"))
          print("DEV TODO-HAVING PY FILES OUTSIDE luffy/:", other)

          ok = (not fail and not order_bad and dupes == 0 and title_count == 1
                and changed_readme_paths == pyc and bm == bd and tm == td)
          print("\nAUDIT RESULT:", "PASS" if ok else "FAIL")
          PY
